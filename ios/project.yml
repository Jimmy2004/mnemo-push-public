name: MnemoPush
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  MnemoCore:
    path: MnemoCore
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.3.2"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targetTemplates:
  App:
    type: application
    platform: iOS
    sources:
      - path: MnemoPush
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mnemo.push
        PRODUCT_NAME: MnemoPush
        INFOPLIST_FILE: MnemoPush/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: MnemoCore
targets:
  MnemoPush:
    templates: [App]
  MnemoPush-NoLog:
    templates: [App]
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) NOLOG"
  MnemoCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MnemoCore/Tests/MnemoCoreTests]
    dependencies:
      - package: MnemoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mnemo.push.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MnemoPush:
    build:
      targets:
        MnemoPush: all
    test:
      targets: [MnemoCoreTests]
  MnemoPush-NoLog:
    build:
      targets:
        MnemoPush-NoLog: all
